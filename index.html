<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOK IN NATURE</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <header>
        <div class="nav-container">
            <a href="#" class="logo">BOOK IN NATURE</a>
            <div class="right-nav">
                <nav>
                    <a href="#home">Home</a>
                    <a href="#Shop">Shop</a>
                    <a href="#Reserve">Reserve</a>
                    <a href="#MyLibrary">My Library</a>
                </nav>
                <div class="icons">
                    <a href="#"><i class='bx bx-search'></i></a>
                    <a href="#"><i class='bx bx-user'></i></a>
                    <a href="#"><i class='bx bx-cart'></i></a>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="hero" id="home">
            <div class="hero-content">
                <h1>GREAT BOOKS<br>ARE ALWAYS WITHIN REACH</h1>
                <p>
                    Buy your favorite books or reserve them at your local library.
                    <br>
                    Read more. Live better.
                </p>
                <form class="search-bar" id="searchForm">
                    <input 
                        type="search" 
                        id="bookSearch" 
                        placeholder="Search for books, authors, genres..." 
                        aria-label="Search books"
                    >
                    <button type="submit">Search</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
