<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOK IN NATURE</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
     <main class="page">
        <h1>BOOK IN NATURE</h1>
        <h2>WELCOME</h2>

        <section class="login-card">
            <form id="loginForm">

                <div class="input-box">
                    <span class="icon">✉</span>
                    <input type="email" placeholder="Email or phone" required>
                </div>

                <div class="input-box">
                    <span class="icon"><svg  xmlns="http://www.w3.org/2000/svg" width="10" height="10"  
fill="currentColor" viewBox="0 0 24 24" >
<!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
<path d="M6 22h12c1.1 0 2-.9 2-2v-9c0-1.1-.9-2-2-2h-1V7c0-2.76-2.24-5-5-5S7 4.24 7 7v2H6c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2M9 7c0-1.65 1.35-3 3-3s3 1.35 3 3v2H9zm-3 4h12v9H6z"></path>
</svg></span>
                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required
                    >
                    <button
                        type="button"
                        id="togglePassword"
                        aria-label="Show password"
                    ></button>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn">
                    Log in
                </button>

                <div class="separator">
                    <span>OR</span>
                </div>

                <button type="button" class="google-btn">
                    <span class="google-icon">G</span>
                    Continue with Google
                </button>

                <p class="signup-text">
                    Don't have an account?
                    <a href="#">Sign up</a>
                </p>

            </form>
        </section>
    </main>

    <script>
        const password = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const loginForm = document.getElementById("loginForm");

        togglePassword.addEventListener("click", function () {
            if (password.type === "password") {
                password.type = "text";
                togglePassword.setAttribute("aria-label", "Hide password");
            } else {
                password.type = "password";
                togglePassword.setAttribute("aria-label", "Show password");
            }
        });

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();
            alert("The interface is working! Connect a backend for real login.");
        });
    </script>
    
</body>
</html>
